name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:

jobs:
  CI:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Needed in order for tags to be available so prereleases autoincrement the version

    - name: Build
      run: ./build.ps1

    - name: Publish to Feedz
      if: github.ref == 'refs/heads/main'
      env:
        FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
      run: dotnet nuget push artifacts\Packages\Instrumental.InstantReplay.*.nupkg --source https://f.feedz.io/jnm2/prerelease/nuget/index.json --api-key "$env:FEEDZ_API_KEY"

    - name: Upload packages artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: artifacts/Packages

    - name: Upload logs artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Logs
        path: artifacts/Logs
